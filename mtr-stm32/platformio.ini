[platformio]
default_envs = vehicle

[env:vehicle]
extra_scripts = pre:../protocol/tools/pio_prebuild_canonical.py
platform = ststm32
platform_packages =
    toolchain-gccarmnoneeabi@~1.100301.0
board = genericSTM32G431CB
framework = stm32cube
upload_protocol = dfu
upload_flags =
    -a
    0
    -s
    0x08000000:leave
debug_tool = custom

build_flags =
    -std=gnu++17
    -O2
    -Wno-error
    -D STM32G431xx
    -D USE_HAL_DRIVER
    -I Core/Inc
    -I src
    -I ..
    -I ../shared

build_src_filter =
    +<../src/*.cpp>
    +<../Core/Src/stm32g4xx_it.c>
    +<../Core/Src/stm32g4xx_hal_msp.c>
    +<../Core/Src/system_stm32g4xx.c>
    +<../Core/Src/syscalls.c>
    +<../Core/Src/sysmem.c>
    +<../Core/Startup/startup_stm32g431cbux.s>

; ── Host-native unit-test environment ──────────────────────────────────────
; Runs the production MTR headers (header-only subsystems) against the HAL stub
; and the golden numeric vectors. The repository's other flat test_*.cpp files
; each define their own main(), so we restrict the build to the comprehensive
; suite via test_filter. Exit code (0 = pass) drives the result.
;
; NOTE: the host `g++.exe` on PATH is MinGW GCC 6.3.0, which lacks <string_view>
; (required transitively by protocol/compat/can_protocol.hpp). Use a C++17
; toolchain >= 7, e.g. put C:\mingw64\bin (GCC 8.1.0) first on PATH before
; invoking `pio test -e native`.
[env:native]
platform = native
test_framework = unity
test_build_src = false
extra_scripts = pre:../protocol/tools/pio_prebuild_canonical.py
test_filter = *full_suite*
test_ignore = test_mtr_motor, test_gear_throttle, test_mtr_diagnostics
build_flags =
    -std=gnu++17
    -Wno-error
    -I .
    -I ..
    -I ../shared
    -I ../protocol
    -I test/stub
    -D HOST_BUILD
    -D TESTING
