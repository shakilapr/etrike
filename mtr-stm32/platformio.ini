[platformio]
default_envs = vehicle

[env:vehicle]
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube
monitor_speed = 115200

build_flags =
    -std=gnu++17
    -Wno-error
    -D USE_HAL_DRIVER
    -D STM32F103xB
    -D FW_VERSION="v0.3.0-vehicle"
    -I ../shared
build_unflags = -Werror

[env:bench]
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube
monitor_speed = 115200

build_flags =
    -std=gnu++17
    -Wno-error
    -D USE_HAL_DRIVER
    -D STM32F103xB
    -D BENCH_BUILD_ACKNOWLEDGED
    -D FW_VERSION="v0.3.0-bench"
    -I ../shared
build_unflags = -Werror
