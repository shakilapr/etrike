[platformio]
default_envs = vehicle

[env:vehicle]
extra_scripts = pre:../protocol/tools/pio_prebuild_canonical.py
platform = espressif32@6.12.0
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.esp_idf.sdkconfig_append = sdkconfig.defaults
test_framework = unity

build_flags =
    -std=gnu++17
    -Wno-error
    -D CONFIG_FREERTOS_HZ=1000
    -D CONFIG_TWAI_ISR_IN_IRAM=1
    -D FW_VERSION=\"v0.1.0-dumb-esp\"
    -I ..
    -I ../shared
build_unflags = -Werror

[env:bench]
extends = env:vehicle
build_flags =
    ${env:vehicle.build_flags}
    -D ETRIKE_SYSTEM_RUN_MODE=2
    ; Self-test ACK when no other CAN node is present on bench.
    -D ETRIKE_DUMB_TWAI_SELF_TEST=1
