[project]
name = "control-toolkit-backend"
version = "0.1.0"
description = "E-Trike Control Toolkit — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-can>=4.3",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["control_toolkit*"]

[tool.pytest.ini_options]
# "." makes `control_toolkit` importable; "../.." puts the repo root on the path so the
# generated `protocol` package resolves without an install (monorepo layout).
pythonpath = [".", "../.."]
testpaths = ["tests"]
asyncio_mode = "auto"
