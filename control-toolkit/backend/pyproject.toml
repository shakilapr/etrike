[project]
name = "control-toolkit-backend"
version = "0.1.0"
description = "E-Trike Control Toolkit — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Hardware behavior was validated against this exact CANalyst-II backend.
    # The extra installs the reverse-engineered userspace driver used by
    # python-can on Windows/Linux/macOS.
    "python-can[canalystii]==4.6.1",
    "pyusb==1.3.1",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["control_toolkit*"]

[tool.pytest.ini_options]
# "." makes `control_toolkit` importable; "../.." puts the repo root on the path so the
# generated `protocol` package resolves without an install (monorepo layout).
pythonpath = [".", "../.."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "hardware: opt-in CANalyst-II checks; requires CTK_PHYSICAL=1 and never transmits",
]
