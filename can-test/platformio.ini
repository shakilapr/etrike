; Minimal CAN smoke tests for ESP32-S3 N16R8 modules.
;   pio run -e role_rt  -t upload --upload-port COM9
;   pio run -e role_sys -t upload --upload-port COM5
; Then watch CTK Real/low bus for 0x100 (RT) and 0x200 (SYS).

[platformio]
default_envs = role_rt

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1-n16r8
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.esp_idf.sdkconfig_append = sdkconfig.defaults
build_src_filter = +<main.cpp> -<spi_test.cpp>
build_unflags = -Werror
build_flags =
    -std=gnu++17
    -Wno-error
    -D CONFIG_FREERTOS_HZ=1000

[env:role_rt]
build_flags =
    ${env.build_flags}
    -D BOARD_ROLE=0
    -D TWAI_SWAP_TX_RX=0

[env:role_sys]
build_flags =
    ${env.build_flags}
    -D BOARD_ROLE=1
    -D TWAI_SWAP_TX_RX=0

; Same roles with TX/RX GPIOs swapped (debug crossed CTX/CRX)
[env:role_rt_swap]
build_flags =
    ${env.build_flags}
    -D BOARD_ROLE=0
    -D TWAI_SWAP_TX_RX=1

[env:role_sys_swap]
build_flags =
    ${env.build_flags}
    -D BOARD_ROLE=1
    -D TWAI_SWAP_TX_RX=1
