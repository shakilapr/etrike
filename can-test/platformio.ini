; Minimal CAN smoke tests for ESP32-S3 N16R8 modules.
;   pio run -e role_rt_seek -t upload --upload-port COM9   # auto pin/mode seek
;   pio run -e role_sys     -t upload --upload-port COM5
; Watch CTK Real/low for 0x100 (RT) and 0x200 (SYS).

[platformio]
default_envs = hw_verify

[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1-n16r8
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.esp_idf.sdkconfig_append = sdkconfig.defaults
build_src_filter = +<main.cpp> -<spi_test.cpp> -<hw_verify.cpp>
build_unflags = -Werror
build_flags =
    -std=gnu++17
    -Wno-error
    -D CONFIG_FREERTOS_HZ=1000

; Full hardware check (PSRAM + low TWAI + high MCP SPI). Flash before vehicle FW.
[env:hw_verify]
board_build.cmake_extra_args =
    -DAPP_SRC=hw_verify.cpp
build_flags =
    ${env.build_flags}

; MCP2515 SPI-only probe
[env:spi]
board_build.cmake_extra_args =
    -DAPP_SRC=spi_test.cpp
build_flags =
    ${env.build_flags}

[env:role_rt]
build_flags =
    ${env.build_flags}
    -D BOARD_ROLE=0
    -D TWAI_SWAP_TX_RX=0
    -D TWAI_FORCE_NO_ACK=0
    -D TWAI_AUTO_SEEK=0

[env:role_sys]
build_flags =
    ${env.build_flags}
    -D BOARD_ROLE=1
    -D TWAI_SWAP_TX_RX=0
    -D TWAI_FORCE_NO_ACK=0
    -D TWAI_AUTO_SEEK=0

[env:role_rt_swap]
build_flags =
    ${env.build_flags}
    -D BOARD_ROLE=0
    -D TWAI_SWAP_TX_RX=1
    -D TWAI_FORCE_NO_ACK=0
    -D TWAI_AUTO_SEEK=0

[env:role_sys_swap]
build_flags =
    ${env.build_flags}
    -D BOARD_ROLE=1
    -D TWAI_SWAP_TX_RX=1
    -D TWAI_FORCE_NO_ACK=0
    -D TWAI_AUTO_SEEK=0

; RT auto-cycles pin maps + NORMAL/NO_ACK until TX sticks
[env:role_rt_seek]
build_flags =
    ${env.build_flags}
    -D BOARD_ROLE=0
    -D TWAI_SWAP_TX_RX=0
    -D TWAI_FORCE_NO_ACK=0
    -D TWAI_AUTO_SEEK=1

; Force NO_ACK continuous TX (shows on bus even without peer ACK if TX path works)
[env:role_rt_noack]
build_flags =
    ${env.build_flags}
    -D BOARD_ROLE=0
    -D TWAI_SWAP_TX_RX=0
    -D TWAI_FORCE_NO_ACK=1
    -D TWAI_AUTO_SEEK=0

[env:role_rt_noack_swap]
build_flags =
    ${env.build_flags}
    -D BOARD_ROLE=0
    -D TWAI_SWAP_TX_RX=1
    -D TWAI_FORCE_NO_ACK=1
    -D TWAI_AUTO_SEEK=0
