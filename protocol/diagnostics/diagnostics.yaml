schema_version: 2

namespaces:
  SYS: 0x01
  RT: 0x02
  MTR: 0x03

vocabularies:
  severity: [INFO, WARNING, ERROR, CRITICAL]
  reaction: [NONE, WARN, DERATE, INHIBIT, CSTOP, ESTOP]
  observability: [DIRECT, DERIVED, COMMUNICATION, SELF_TEST, EXTERNAL_REPORTED, UNOBSERVABLE]
  monitoring: [IMPLEMENTED, NOT_IMPLEMENTED]
  detection_basis: [DIRECT_HW, DIRECT_SW, DERIVED]
  disposition: [ACTIVE, PHASE_C, DEFERRED, OMITTED]
  failure_mode: [ASSERTED, TIMEOUT, STALE, INVALID, IMPLAUSIBLE, MISMATCH, FOLLOWING_ERROR, BUS_OFF, ERROR_PASSIVE, CRC_ERROR, COUNTER_ERROR, OVERFLOW, DEADLINE_MISSED, OVERTEMP, UNDERTEMP, UNDERVOLTAGE, RESOURCE_LOW, RESET, WRITE_FAILED, INTERNAL_ERROR]

