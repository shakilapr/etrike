[platformio]
default_envs = vehicle
test_dir = pio-test

[env:vehicle]
extra_scripts = pre:../shared/can/pio_prebuild.py
    pre:../shared/can/patch_sdkconfig.py
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.esp_idf.sdkconfig_append = sdkconfig.defaults
build_src_filter = +<main.cpp> +<freertos_hooks.cpp> +<mode_manager.cpp> +<safety_monitor.cpp> -<native_entry.cpp> -<test_sys_qa.cpp>

build_flags =
    -std=gnu++17
    -Wno-error
    -D CONFIG_FREERTOS_HZ=1000
    -D CONFIG_TWAI_ISR_IN_IRAM=1
    -D FW_VERSION="v0.3.0-alpha-vehicle"
    -I ../shared
build_unflags = -Werror

[env:bench]
extra_scripts = pre:../shared/can/pio_prebuild.py
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
build_src_filter = +<main.cpp> +<freertos_hooks.cpp> +<mode_manager.cpp> +<safety_monitor.cpp> -<native_entry.cpp> -<test_sys_qa.cpp>

build_flags =
    -std=gnu++17
    -Wno-error
    -D CONFIG_FREERTOS_HZ=1000
    -D CONFIG_TWAI_ISR_IN_IRAM=1
    -D TESTING
    -D SYS_OWNS_MOTOR
    -D FW_VERSION="v0.3.0-alpha-bench"
    -I ../shared
build_unflags = -Werror

[env:native]
platform = native
build_src_filter = +<mode_manager.cpp> +<safety_monitor.cpp> +<native_entry.cpp>
test_framework = unity
test_build_src = false
test_filter = test_pio_native
build_flags =
    -std=gnu++17
    -Wno-error
    -mconsole
    -I ../shared
    -I ../native-test/hal/shadow
    -D HOST_BUILD
    -D TESTING
