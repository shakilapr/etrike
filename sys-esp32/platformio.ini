[platformio]
default_envs = vehicle
test_dir = test

[env:vehicle]
extra_scripts = pre:../protocol/tools/pio_prebuild_canonical.py
    pre:patch_sdkconfig.py
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.esp_idf.sdkconfig_append = sdkconfig.defaults
build_src_filter = +<main.cpp> +<freertos_hooks.cpp> +<mode_manager.cpp> +<safety_monitor.cpp> -<native_entry.cpp> -<test_sys_qa.cpp>
test_framework = unity

build_flags =
    -std=gnu++17
    -Wno-error
    -D CONFIG_FREERTOS_HZ=1000
    -D CONFIG_TWAI_ISR_IN_IRAM=1
    -D FW_VERSION="v0.3.0-alpha-vehicle"
    -I ..
    -I ../shared
build_unflags = -Werror

[env:bench]
extra_scripts = pre:../protocol/tools/pio_prebuild_canonical.py
    pre:patch_sdkconfig.py
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
build_src_filter = +<main.cpp> +<freertos_hooks.cpp> +<mode_manager.cpp> +<safety_monitor.cpp> -<native_entry.cpp> -<test_sys_qa.cpp>
test_framework = unity

build_flags =
    -std=gnu++17
    -Wno-error
    -D CONFIG_FREERTOS_HZ=1000
    -D CONFIG_TWAI_ISR_IN_IRAM=1
    -D TESTING
    -D ETRIKE_SYSTEM_RUN_MODE=2
    -D FW_VERSION="v0.3.0-alpha-bench"
    -I ..
    -I ../shared
build_unflags = -Werror

[env:hardware_bench]
extends = env:vehicle
build_flags =
    ${env:vehicle.build_flags}
    -D ETRIKE_SYSTEM_RUN_MODE=1

[env:native]
platform = native
build_src_filter = +<*.cpp> -<main.cpp> -<freertos_hooks.cpp>
test_framework = unity
test_build_src = true
build_flags =
    -std=gnu++17
    -Wno-error
    -mconsole
    -I ..
    -I ../shared
    -I ../native-test/hal/shadow
    -D HOST_BUILD
    -D TESTING
    -D ETRIKE_SYSTEM_RUN_MODE=2
