[platformio]
default_envs = vehicle

[env:vehicle]
extra_scripts = pre:../protocol/tools/pio_prebuild_canonical.py
platform = espressif32@6.12.0
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.esp_idf.sdkconfig_append = sdkconfig.defaults
test_framework = unity

build_flags =
    -std=gnu++17
    -Wno-error
    -D CONFIG_FREERTOS_HZ=1000
    -D CONFIG_TWAI_ISR_IN_IRAM=1
    -D FW_VERSION="v0.8.0-alpha-rm-t12d"
    -I ..
    -I ../shared
build_unflags = -Werror

[env:bench]
extends = env:vehicle
build_flags =
    ${env:vehicle.build_flags}
    -D TESTING
    -D ETRIKE_SYSTEM_RUN_MODE=2
    ; No ACK-capable peer on the bench: let TWAI supply its own ACK so the
    ; transceiver keeps driving CAN_H/CAN_L instead of walking TEC to Bus-Off.
    -D ETRIKE_RM_TWAI_SELF_TEST=1

[env:esp32s3]
extends = env:vehicle
board = esp32-s3-devkitc-1-n16r8
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
