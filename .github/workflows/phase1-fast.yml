name: Phase 1 Fast Gate

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  phase1-fast:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install simulation dependencies
        working-directory: simulation
        run: npm ci

      - name: Install PlatformIO
        run: pipx install platformio

      - name: Run Phase 1 fast gate
        shell: pwsh
        run: ./tools/phase1-software-gate.ps1 -SkipVehicle

      - name: Upload Phase 1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-artifacts
          path: artifacts/phase1/**
