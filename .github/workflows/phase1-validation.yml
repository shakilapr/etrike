name: Phase 1 Software Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install PlatformIO
      run: pip install platformio

    - name: Run Phase 1 Software Gate
      run: powershell -File tools/phase1-software-gate.ps1

    - name: Archive artifacts
      uses: actions/upload-artifact@v3
      with:
        name: phase1-reports
        path: artifacts/phase1/
