name: CI
on:
  push:
    paths:
      - 'rt-esp32/**'
      - 'sys-esp32/**'
      - 'shared/**'
      - 'protocol/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'rt-esp32/**'
      - 'sys-esp32/**'
      - 'shared/**'
      - 'protocol/**'
      - '.github/workflows/ci.yml'
jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck
      - run: cppcheck --enable=all --suppress=missingIncludeSystem --suppress=unmatchedSuppression --inline-suppr --error-exitcode=0 --quiet rt-esp32/src/ sys-esp32/src/ shared/



  pio-rt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio pydantic PyYAML
      - run: cd rt-esp32 && pio run

  pio-sys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio pydantic PyYAML
      - run: cd sys-esp32 && pio run



  vehicle-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio pydantic PyYAML
      - name: Build RT and SYS ECUs with vehicle profile
        run: |
          failed=0
          for dir in rt-esp32 sys-esp32; do
            echo "=== Building $dir (vehicle profile) ==="
            cd "$dir"
            pio run -e vehicle 2>&1 | tee build.log
            # Check build log for bypass flags in compiler commands
            if grep -Eq '\-D\s*(CONFIG_BENCH_SOLO|TESTING|CONFIG_BYPASS)' build.log; then
              echo "FAIL: bypass flag found in build output for $dir"
              failed=1
            fi
            # Check generated sdkconfig.h for bypass defines
            sdk=".pio/build/vehicle/config/sdkconfig.h"
            if [ -f "$sdk" ]; then
              if grep -qE '(CONFIG_BENCH_SOLO|TESTING|CONFIG_BYPASS)' "$sdk"; then
                echo "FAIL: bypass flag found in $dir sdkconfig.h"
                failed=1
              fi
            fi
            cd ..
          done
          if [ "$failed" -ne 0 ]; then
            echo "Vehicle profile verification FAILED — bypass flags detected"
            exit 1
          fi
          echo "RT and SYS ECUs built with zero bypass flags"

  bypass-audit:
    needs: [vehicle-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit vehicle profiles for bypass flags
        run: |
          failed=0
          for dir in rt-esp32 sys-esp32; do
            ini="$dir/platformio.ini"
            echo "=== Auditing $ini ==="
            # Check that the [env:vehicle] section contains zero bypass flags
            in_vehicle=false
            while IFS= read -r line; do
              case "$line" in
                "[env:vehicle]") in_vehicle=true ;;
                "[env:"*) test "$line" = "[env:vehicle]" || in_vehicle=false ;;
              esac
              if $in_vehicle; then
                if echo "$line" | grep -qE '(CONFIG_BENCH_SOLO|TESTING|CONFIG_BYPASS)'; then
                  echo "FAIL: $dir vehicle profile contains bypass flag: $line"
                  failed=1
                fi
              fi
            done < "$ini"
          done
          # Verify bench profile has expected bypass flags (sanity check)
          for dir in rt-esp32 sys-esp32; do
            ini="$dir/platformio.ini"
            found_bench=false
            in_bench=false
            while IFS= read -r line; do
              case "$line" in
                "[env:bench]") in_bench=true ;;
                "[env:"*) test "$line" = "[env:bench]" || in_bench=false ;;
              esac
              if $in_bench; then
                if echo "$line" | grep -qE 'CONFIG_BENCH_SOLO'; then
                  found_bench=true
                fi
              fi
            done < "$ini"
            if ! $found_bench; then
              echo "WARNING: $dir bench profile missing CONFIG_BENCH_SOLO (might need update)"
            fi
          done
          echo "Audit complete"
          exit "$failed"
