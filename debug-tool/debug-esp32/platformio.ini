; PlatformIO Project Configuration for debug-esp32
; ESP32-S3 CAN bridge with dual-bus (TWAI + MCP2515) over MQTT

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200

build_flags =
    -D CONFIG_TWAI_ERRATA_FIX_LISTEN_ONLY_DOM=1
    -Wno-error
    -Wno-missing-field-initializers
build_unflags = -Werror
