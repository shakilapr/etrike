# =============================================================================
# E-Trike CAN Definitions — single source of truth for DBC generation.
# =============================================================================
# High-Level CAN Bus — Jetson ↔ RT perception/planning (500 kbit/s).
# All messages that appear on the high CAN bus.
# Forwarded frames are duplicated identically in can_low.yaml — each DBC
# must be self-contained.
#
# This is the primary YAML file — it owns the shared metadata
# (can_version, constants, ecus). can_low.yaml only defines protocols.
#
# Generates: shared/can/etrike_high.dbc (custom protocol, Motorola/big-endian)
# Usage:     python generate_all_dbc.py              # generate all 4 DBCs
#            python generate_all_dbc.py --check      # generate + validate
#            python generate_all_dbc.py --summary    # print signal table
# =============================================================================

can_version: "1.0"
description: "E-Trike CAN signal definitions — single source of truth for DBC generation"

# ── Shared Constants — single source of truth for all projects ───────
constants:
  # Vehicle geometry
  wheelbase_mm: 1500

  # Obstacle
  obstacle_stop_mm: 300
  obstacle_clear_mm: 3000

  # Speed limits
  max_speed_fwd_mmps: 3000
  max_speed_rev_mmps: 500
  low_speed_thresh_mmps: 50

  # Safety timeouts
  cmd_stale_timeout_ms: 500
  heartbeat_timeout_host_ms: 1500
  heartbeat_timeout_sys_ms: 200     # SYS→RT: 2 missed at 10 Hz
  heartbeat_timeout_rt_ms: 1000     # RT→SYS: 2 missed at 2 Hz (low bus)
  startup_grace_period_ms: 3000

  # Brake
  brake_stroke_scale: 0.05
  brake_stroke_offset: -30.0
  max_brake_kpa: 5000               # SEB physical limit: 5 MPa = 100 raw = 5000 kPa
  seb_max_pressure_raw: 100         # SEB max pressure raw value
  obstacle_max_kpa: 5000            # max from obstacle distance formula
  assist_stop_kpa: 2000             # Host heartbeat loss → assisted stop
  host_brake_max_kpa: 20000         # 0x301 HOST_BRAKE_REQ max range

  # Steering
  steer_hard_limit_deg: 40.0
  steer_following_err_min_deg: 2.0
  steer_following_err_factor: 0.25
  steer_following_err_ms: 300
  steer_estop_ramp_deg_s: 20.0
  steer_estop_hold_ms: 500
  steer_cmd_rate_hz: 50

  # MTR fault flags (0x206 byte 3)
  mtr_fault_estop_active: 0x01
  mtr_fault_cmd_timeout: 0x02
  mtr_fault_adc_fault: 0x04
  mtr_fault_gear_conflict: 0x08

# ── All ECUs ──────────────────────────────────────────────────────────
ecus:
  - {name: Host,   comment: "Orin NX, Linux + ROS 2, perception/planning"}
  - {name: RT,     comment: "ESP32-S3, FreeRTOS, realtime kinematics + CAN gateway"}
  - {name: SYS,    comment: "ESP32-S3, FreeRTOS, safety + motor + body control"}
  - {name: MTR,    comment: "STM32, bare metal, motor DAC + gear relays (EGAS L1)"}
  - {name: DCDC,   comment: "DC-DC converter (72V->12V), CAN 0x012 control"}
  - {name: EPS_C,  comment: "steer-by-wire unit, steer-by-wire module, preprogrammed CAN IDs"}
  - {name: SEB,    comment: "brake-by-wire unit, electro-hydraulic brake module, preprogrammed CAN IDs"}
  - {name: Any,    comment: "Wildcard — any node may send (e.g., ESTOP frames)"}

protocols:

  # ── Custom Protocol — High Bus (Motorola/big-endian) ────────────────
  custom_high:
    byte_order: motorola
    bus: "high"
    output: shared/can/etrike_high.dbc
    messages:

      # 0x001 — SAFETY_ESTOP (DLC=0 event frame, any node can send)
      # Forwarded bidirectionally by RT. Appears on both buses.
      - id: 0x001
        name: SAFETY_ESTOP
        dlc: 0
        sender: Any
        receivers: [SYS, Host, MTR, DCDC]
        cycle_ms: 0
        comment: "DLC=0 — the frame ID itself is the ESTOP signal. Any node can send (RT is nominal). Bridged bidirectionally. Highest priority CAN frame."
        signals: []

      # 0x011 — SYS_SAFETY_STS (forwarded low→high by RT)
      - id: 0x011
        name: SYS_SAFETY_STS
        dlc: 3
        sender: SYS
        receivers: [RT, Host]
        cycle_ms: 200
        comment: "Forwarded low→high by RT. Same payload on both buses. DLC=3 adds light state (v0.0.5)."
        signals:
          - {name: SYS_EstopActive, byte: 0, bit_offset: 0, size: 8, min: 0, max: 1}
          - {name: SYS_HeartbeatOk, byte: 1, bit_offset: 0, size: 8, min: 0, max: 1,
             comment: "0=RT alive counter frozen >1000ms, 1=incrementing"}
          - {name: SYS_LightState, byte: 2, bit_offset: 0, size: 4,
             comment: "bit0=left_turn_active, bit1=right_turn_active, bit2=brake_light_active, bit3=headlight_active"}

      # 0x120 — SYS_THROTTLE_STS (MTR→RT, forwarded low→high)
      # Historical note: SYS_ prefix is legacy — physical sender is MTR (STM32).
      - id: 0x120
        name: SYS_THROTTLE_STS
        dlc: 2
        sender: MTR
        receivers: [RT, Host]
        cycle_ms: 10
        comment: "Current vehicle speed from MTR STM32. Forwarded low→high by RT. SYS_ prefix is historical."
        signals:
          - {name: SYS_ThrottleSpeed, byte: 0, bit_offset: 0, size: 16,
             type: signed, factor: 1, offset: 0,
             min: -500, max: 3000, unit: mm/s}

      # 0x206 — MTR_MOTOR_FBK (MTR→RT,SYS on low, forwarded low→high)
      - id: 0x206
        name: MTR_MOTOR_FBK
        dlc: 4
        sender: MTR
        receivers: [RT, SYS, Host]
        cycle_ms: 20
        comment: "Motor feedback from STM32. Forwarded low→high by RT per gateway rules."
        signals:
          - {name: MTR_ActualSpeed, byte: 0, bit_offset: 0, size: 16,
             type: signed, factor: 1, offset: 0,
             min: -500, max: 3000, unit: mm/s}
          - {name: MTR_GearState, byte: 2, bit_offset: 0, size: 8, min: 0, max: 3, unit: enum,
             values: {0: N, 1: D, 2: S, 3: R}}
          - {name: MTR_FaultFlags, byte: 3, bit_offset: 0, size: 8, min: 0, max: 255,
             values: {1: EstopActive, 2: CmdTimeout, 4: AdcFault, 8: GearConflict, 16: StartupReady},
             comment: "bit0=ESTOP, bit1=CMD timeout, bit2=ADC fault, bit3=gear conflict, bit4=MTR startup ready"}

      # 0x210 — RT_STATE_RPT (RT→Host on high bus, also sent on low bus for SYS)
      - id: 0x210
        name: RT_STATE_RPT
        dlc: 6
        sender: RT
        receivers: [Host, SYS]
        cycle_ms: 100
        comment: "RT state report to Host (high bus) and SYS (low bus). SYS monitors safety_state for takeover detection and RT health."
        signals:
          - {name: RT_Mode, byte: 0, bit_offset: 0, size: 8, min: 0, max: 2, unit: enum,
             values: {0: Manual, 1: Auto, 2: ESTOP}}
          - {name: RT_SafetyState, byte: 1, bit_offset: 0, size: 2, min: 0, max: 2, unit: enum,
             values: {0: Normal, 1: InternalEstop, 2: Fault},
             comment: "RT internal state: 0=Normal, 1=Internal ESTOP (steer ramp/hold), 2=Fault"}
          - {name: RT_EstopReason, byte: 1, bit_offset: 4, size: 4, min: 0, max: 7, unit: enum,
             values: {0: None, 1: Button, 2: Heartbeat, 3: FollowingError, 4: Obstacle, 5: CanEstop, 6: BusOff, 7: Internal},
             comment: "Reason for ESTOP state, packed in byte 1 bits 4-7"}
          - {name: RT_Reversing, byte: 2, bit_offset: 0, size: 8, min: 0, max: 1}
          - {name: RT_RxOverflow, byte: 3, bit_offset: 0, size: 8, min: 0, max: 255,
             comment: "MCP2515 RX overflow counter — telemetry for CAN bus health monitoring"}
          - {name: RT_TaskHealth, byte: 4, bit_offset: 0, size: 8, min: 0, max: 255,
             comment: "Bitmask of alive tasks (bits 0-3: control/dispatch/tx_low/tx_high)"}
          - {name: RT_SteerState, byte: 5, bit_offset: 0, size: 8, min: 0, max: 5, unit: enum,
             values: {0: BootWait, 1: ListenSync, 2: Active, 3: EstopRamp, 4: EstopHold, 5: Fault},
             comment: "Steering state machine value"}

      # 0x220 — RT_PID_RPT (reserved, inactive)
      - id: 0x220
        name: RT_PID_RPT
        dlc: 6
        sender: RT
        receivers: [Host]
        cycle_ms: 100
        comment: "RESERVED, inactive. PID telemetry for Host debugging."
        signals:
          - {name: RT_PidSetpoint, byte: 0, bit_offset: 0, size: 16, type: signed, unit: mm/s}
          - {name: RT_PidMeasured, byte: 2, bit_offset: 0, size: 16, type: signed, unit: mm/s}
          - {name: RT_PidOutput, byte: 4, bit_offset: 0, size: 16, type: signed}

      # 0x300 — HOST_DRIVE_CMD (Host→RT on high bus)
      - id: 0x300
        name: HOST_DRIVE_CMD
        dlc: 8
        sender: Host
        receivers: [RT]
        cycle_ms: 10
        comment: "Host (Jetson Orin) Autoware.Auto drive command -> RT. High bus only."
        signals:
          - {name: HOST_DriveSpeed, byte: 0, bit_offset: 0, size: 32,
             type: signed, factor: 1, offset: 0,
             min: -500, max: 3000, unit: mm/s,
             comment: "ROS 2: linear.x * 1000"}
          - {name: HOST_YawRate, byte: 4, bit_offset: 0, size: 24,
             type: signed, factor: 1, offset: 0,
             min: -3000, max: 3000, unit: mrad/s,
             comment: "ROS 2: angular.z * 1000. i24 big-endian at bytes 4-6."}
          - {name: HOST_Gear, byte: 7, bit_offset: 0, size: 8, min: 0, max: 3, unit: enum,
             values: {0: N, 1: D, 2: S, 3: R}}

      # 0x301 — HOST_BRAKE_REQ (Host→RT on high bus)
      - id: 0x301
        name: HOST_BRAKE_REQ
        dlc: 4
        sender: Host
        receivers: [RT]
        cycle_ms: 0
        comment: "On demand. RT arbitrates: max(RT_computed, HOST_request) -> 0x205."
        signals:
          - {name: HOST_BrakePressure, byte: 0, bit_offset: 0, size: 32,
             type: signed, factor: 1, offset: 0,
             min: 0, max: 20000, unit: kPa}

      # 0x302 — HOST_LIGHT_CMD (Host→RT, forwarded high→low)
      - id: 0x302
        name: HOST_LIGHT_CMD
        dlc: 1
        sender: Host
        receivers: [RT, SYS]
        cycle_ms: 0
        comment: "Forwarded transparently high→low by RT."
        signals:
          - {name: HOST_LeftTurn,   byte: 0, bit_offset: 0, size: 1, min: 0, max: 1}
          - {name: HOST_RightTurn,  byte: 0, bit_offset: 1, size: 1, min: 0, max: 1}
          - {name: HOST_BrakeLight, byte: 0, bit_offset: 2, size: 1, min: 0, max: 1}
          - {name: HOST_Headlight,  byte: 0, bit_offset: 3, size: 1, min: 0, max: 1}

      # 0x310 — STEER_DIAG (RT→Host, steering telemetry @10Hz, v0.0.4)
      - id: 0x310
        name: STEER_DIAG
        dlc: 8
        sender: RT
        receivers: [Host]
        cycle_ms: 100
        comment: "Steering telemetry to Host. v0.0.4 — previously missing from DBC."
        signals:
          - {name: SteerDiag_Angle0_1deg,   byte: 0, bit_offset: 0, size: 16,
             factor: 0.1, offset: -3000, unit: deg,
             comment: "Actual steering angle. physical_deg = raw * 0.1 - 3000. Raw 30000 -> 0deg."}
          - {name: SteerDiag_Fault,         byte: 2, bit_offset: 0, size: 8, min: 0, max: 1,
             comment: "0=OK, 1=EPS-C fault"}
          - {name: SteerDiag_MotorCurrent,  byte: 3, bit_offset: 0, size: 16,
             factor: 0.01, offset: 0, unit: A,
             comment: "EPS-C motor current, 0.01A/bit"}
          - {name: SteerDiag_ECUTemp,       byte: 5, bit_offset: 0, size: 16,
             factor: 0.1, offset: 0, unit: degC,
             comment: "EPS-C ECU temperature, 0.1degC/bit"}
          - {name: SteerDiag_Reserved,      byte: 7, bit_offset: 0, size: 8, min: 0, max: 0}

      # 0x311 — BRAKE_DIAG (RT→Host, brake telemetry @10Hz, v0.0.4)
      - id: 0x311
        name: BRAKE_DIAG
        dlc: 8
        sender: RT
        receivers: [Host]
        cycle_ms: 100
        comment: "Brake telemetry to Host. v0.0.4 — previously missing from DBC."
        signals:
          - {name: BrakeDiag_PressureRaw,   byte: 0, bit_offset: 0, size: 16,
             factor: 0.05, offset: 0, unit: MPa,
             comment: "SEB pressure raw, 0.05 MPa/bit"}
          - {name: BrakeDiag_Fault,         byte: 2, bit_offset: 0, size: 8, min: 0, max: 1,
             comment: "0=OK, 1=SEB fault"}
          - {name: BrakeDiag_MotorCurrent,  byte: 3, bit_offset: 0, size: 16,
             factor: 0.01, offset: 0, unit: A,
             comment: "SEB motor current, 0.01A/bit"}
          - {name: BrakeDiag_ECUTemp,       byte: 5, bit_offset: 0, size: 16,
             factor: 0.1, offset: 0, unit: degC,
             comment: "SEB ECU temperature, 0.1degC/bit"}
          - {name: BrakeDiag_Reserved,      byte: 7, bit_offset: 0, size: 8, min: 0, max: 0}

      # 0x400 — HOST_OBSTACLE_DIST (Host→RT on high bus)
      - id: 0x400
        name: HOST_OBSTACLE_DIST
        dlc: 4
        sender: Host
        receivers: [RT]
        cycle_ms: 100
        comment: "Host sends min obstacle distance (from LiDAR/camera perception) to RT at 10 Hz. High bus only."
        signals:
          - {name: HOST_ObstacleDistance, byte: 0, bit_offset: 0, size: 32,
             min: 0, max: 4294967295, unit: mm,
             comment: "UINT32_MAX = no reading / timeout"}

      # 0x600 — SYS_DIAG_RPT (SYS→RT, forwarded low→high)
      - id: 0x600
        name: SYS_DIAG_RPT
        dlc: 8
        sender: SYS
        receivers: [RT, Host]
        cycle_ms: 1000
        comment: "SYS diagnostics report. Forwarded low→high by RT."
        signals:
          - {name: SYS_DiagMode,          byte: 0, bit_offset: 0, size: 8,  min: 0, max: 2}
          - {name: SYS_DiagBrakeEngaged,  byte: 1, bit_offset: 0, size: 1,  min: 0, max: 1}
          - {name: SYS_DiagBrakeFault,    byte: 1, bit_offset: 1, size: 1,  min: 0, max: 1, comment: "SEB L3 fault or brake following-error active"}
          - {name: SYS_DiagHeartbeatOk,   byte: 2, bit_offset: 0, size: 8,  min: 0, max: 1}
          - {name: SYS_DiagEstopActive,   byte: 3, bit_offset: 0, size: 8,  min: 0, max: 1}
          - {name: SYS_DiagFreeHeapKb,    byte: 4, bit_offset: 0, size: 16, min: 0, max: 65535, unit: KB}
          - {name: SYS_DiagTec,           byte: 6, bit_offset: 0, size: 8,  min: 0, max: 255}
          - {name: SYS_DiagRec,           byte: 7, bit_offset: 0, size: 8,  min: 0, max: 255}

      # 0x7FC — HOST_HEARTBEAT (Host→RT, high bus only)
      - id: 0x7FC
        name: HOST_HEARTBEAT
        dlc: 1
        sender: Host
        receivers: [RT]
        cycle_ms: 500
        comment: "Not bridged, high bus only. Loss triggers controlled stop, not ESTOP."
        signals:
          - {name: Host_AliveCtr, byte: 0, bit_offset: 0, size: 8, min: 0, max: 255,
             comment: "Timeout 1500ms -> controlled stop. Host is QM, not safety-critical."}

      # 0x7FD — RT_HEARTBEAT (both buses, independent counters)
      # High-bus instance — independent counter from low bus.
      - id: 0x7FD
        name: RT_HEARTBEAT
        dlc: 2
        sender: RT
        receivers: [Host, SYS]
        cycle_ms: 500
        comment: "RT sends independently on both buses (per-bus, NOT bridged). Separate counters. This is the high-bus instance."
        signals:
          - {name: RT_AliveCtr, byte: 0, bit_offset: 0, size: 8, min: 0, max: 255,
             comment: "High bus timeout 1500ms->Host stops /cmd_vel"}
          - {name: RT_HealthFlags, byte: 1, bit_offset: 0, size: 8, min: 0, max: 255,
             comment: "bit0=heartbeat_ok, bit1=estop_active, bit2=mode_auto, bit3=can_ok, bits4-7=reserved"}
