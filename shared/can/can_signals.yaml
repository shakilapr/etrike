# =============================================================================
# E-Trike CAN Signal Dictionary — Single Source of Truth
# =============================================================================
# All CAN signal definitions for the three-node distributed architecture.
# Use byte/bit_offset notation (no 0-63 start_bit confusion).
# byte=N, bit_offset=0 means "starts at bit 0 (LSB) of byte N in the CAN payload."
#
# Generates these files:
#   -> shared/can/etrike_custom.dbc   (custom protocol, Motorola/big-endian)
#   -> shared/can/syntree_eps.dbc     (SYNTREE EPS-C, Intel/little-endian)
#   -> shared/can/syntree_seb.dbc     (SYNTREE SEB, Intel/little-endian)
#
# Usage:
#   python generate_all_dbc.py              # generate all DBCs
#   python generate_all_dbc.py --check      # generate + validate
#   python generate_all_dbc.py --summary    # print signal table
# =============================================================================

can_version: "1.0"
description: "E-Trike CAN signal definitions — single source of truth for DBC generation"

# ── Shared Constants (from shared_config.h) ───────────────────────────
constants:
  max_speed_fwd_mmps: 3000
  max_speed_rev_mmps: 500
  max_brake_kpa: 20000
  brake_stroke_scale: 0.05
  brake_stroke_offset: -30.0
  seb_max_pressure_raw: 100

# ── All ECUs ──────────────────────────────────────────────────────────
ecus:
  - {name: Jetson, comment: "Orin NX, Linux + ROS 2, perception/planning"}
  - {name: RT,     comment: "ESP32-S3, FreeRTOS, realtime kinematics + CAN gateway"}
  - {name: SYS,    comment: "ESP32-S3, FreeRTOS, safety + motor + body control"}
  - {name: MTR,    comment: "STM32, bare metal, motor DAC + gear relays (EGAS L1)"}
  - {name: DCDC,   comment: "DC-DC converter (72V->12V), CAN 0x012 control"}
  - {name: EPS_C,  comment: "SYNTREE EPS-C, steer-by-wire module, preprogrammed CAN IDs"}
  - {name: SEB,    comment: "SYNTREE SEB, electro-hydraulic brake module, preprogrammed CAN IDs"}

# =============================================================================
# Protocols
# =============================================================================

protocols:

  # ── Custom Protocol (Motorola/big-endian) ──────────────────────────
  custom:
    byte_order: motorola
    bus: "low+high"
    output: shared/can/etrike_custom.dbc
    messages:

      # 0x001 — SAFETY_ESTOP (DLC=0 event frame, any node can send)
      - id: 0x001
        name: SAFETY_ESTOP
        dlc: 0
        sender: RT
        receivers: [SYS, Jetson, MTR, DCDC]
        cycle_ms: 0
        comment: "DLC=0 — the frame ID itself is the ESTOP signal. Any node can send (RT is nominal). Bridged bidirectionally. Highest priority CAN frame."
        signals: []

      # 0x011 — SYS_SAFETY_STS (forwarded low->high by RT)
      - id: 0x011
        name: SYS_SAFETY_STS
        dlc: 2
        sender: SYS
        receivers: [RT, Jetson]
        cycle_ms: 200
        comment: "Forwarded low->high by RT. Same payload on both buses."
        signals:
          - {name: SYS_EstopActive, byte: 0, bit_offset: 0, size: 8, min: 0, max: 1}
          - {name: SYS_HeartbeatOk, byte: 1, bit_offset: 0, size: 8, min: 0, max: 1,
             comment: "0=RT alive counter frozen >1000ms, 1=incrementing"}

      # 0x012 — SYS_DCDC_CMD (low bus only)
      - id: 0x012
        name: SYS_DCDC_CMD
        dlc: 1
        sender: SYS
        receivers: [DCDC]
        cycle_ms: 100
        comment: "DC-DC converter control. Low bus only."
        signals:
          - {name: SYS_DcdcEnable, byte: 0, bit_offset: 0, size: 8, min: 0, max: 1,
             comment: "ESTOP->1(on); maintains 12V for MCUs, CAN transceivers, brake light"}

      # 0x110 — SYS_MODE_CMD (low bus only)
      - id: 0x110
        name: SYS_MODE_CMD
        dlc: 1
        sender: SYS
        receivers: [RT]
        cycle_ms: 0
        comment: "0=Manual, 1=Auto, 2=ESTOP. Low bus only."
        signals:
          - {name: SYS_Mode, byte: 0, bit_offset: 0, size: 8, min: 0, max: 2, unit: enum,
             values: {0: Manual, 1: Auto, 2: ESTOP}}

      # 0x120 — SYS_THROTTLE_STS (MTR->RT, forwarded low->high)
      # Historical note: SYS_ prefix is legacy — physical sender is MTR (STM32).
      - id: 0x120
        name: SYS_THROTTLE_STS
        dlc: 2
        sender: MTR
        receivers: [RT, Jetson]
        cycle_ms: 10
        comment: "Current vehicle speed from MTR STM32. Forwarded low->high by RT. SYS_ prefix is historical."
        signals:
          - {name: SYS_ThrottleSpeed, byte: 0, bit_offset: 0, size: 16,
             type: signed, factor: 1, offset: 0,
             min: -500, max: 3000, unit: mm/s}

      # 0x204 — RT_DRIVE_CMD (RT->SYS,MTR on low bus)
      - id: 0x204
        name: RT_DRIVE_CMD
        dlc: 5
        sender: RT
        receivers: [SYS, MTR]
        cycle_ms: 10
        comment: "MTR receives for motor actuation. SYS receives for EGAS L2 monitoring. ID 0x204 avoids collision with EPS-C 0x202."
        signals:
          - {name: RT_MotorSpeed, byte: 0, bit_offset: 0, size: 32,
             type: signed, factor: 1, offset: 0,
             min: -500, max: 3000, unit: mm/s}
          - {name: RT_Gear, byte: 4, bit_offset: 0, size: 8, min: 0, max: 3, unit: enum,
             values: {0: N, 1: D, 2: S, 3: R}}

      # 0x205 — RT_BRAKE_CMD (RT->SYS on low bus)
      - id: 0x205
        name: RT_BRAKE_CMD
        dlc: 4
        sender: RT
        receivers: [SYS]
        cycle_ms: 20
        comment: "RT max-select: max(rt_obstacle, jetson_0x301) -> SYS SEB cmd."
        signals:
          - {name: RT_BrakePressure, byte: 0, bit_offset: 0, size: 32,
             type: signed, factor: 1, offset: 0,
             min: 0, max: 20000, unit: kPa}

      # 0x206 — MTR_MOTOR_FBK (MTR->RT,SYS on low bus)
      - id: 0x206
        name: MTR_MOTOR_FBK
        dlc: 4
        sender: MTR
        receivers: [RT, SYS]
        cycle_ms: 20
        comment: "Motor feedback from STM32. Low bus only."
        signals:
          - {name: MTR_ActualSpeed, byte: 0, bit_offset: 0, size: 16,
             type: signed, factor: 1, offset: 0,
             min: -500, max: 3000, unit: mm/s}
          - {name: MTR_GearState, byte: 2, bit_offset: 0, size: 8, min: 0, max: 3, unit: enum,
             values: {0: N, 1: D, 2: S, 3: R}}
          - {name: MTR_FaultFlags, byte: 3, bit_offset: 0, size: 8, min: 0, max: 255,
             values: {1: Overcurrent, 2: Overtemp, 4: CommsLoss},
             comment: "bit0=ESTOP, bit1=CMD timeout, bit2=ADC fault, bit3=gear conflict"}

      # 0x210 — RT_STATE_RPT (RT->Jetson on high bus)
      - id: 0x210
        name: RT_STATE_RPT
        dlc: 3
        sender: RT
        receivers: [Jetson]
        cycle_ms: 100
        comment: "RT state report to Jetson. High bus only."
        signals:
          - {name: RT_Mode, byte: 0, bit_offset: 0, size: 8, min: 0, max: 2, unit: enum,
             values: {0: Manual, 1: Auto, 2: ESTOP}}
          - {name: RT_SteerValid, byte: 1, bit_offset: 0, size: 8, min: 0, max: 1}
          - {name: RT_Reversing, byte: 2, bit_offset: 0, size: 8, min: 0, max: 1}

      # 0x220 — RT_PID_RPT (reserved, inactive)
      - id: 0x220
        name: RT_PID_RPT
        dlc: 6
        sender: RT
        receivers: [Jetson]
        cycle_ms: 100
        comment: "RESERVED, inactive. PID telemetry for Jetson debugging."
        signals:
          - {name: RT_PidSetpoint, byte: 0, bit_offset: 0, size: 16, type: signed, unit: mm/s}
          - {name: RT_PidMeasured, byte: 2, bit_offset: 0, size: 16, type: signed, unit: mm/s}
          - {name: RT_PidOutput, byte: 4, bit_offset: 0, size: 16, type: signed}

      # 0x300 — HOST_DRIVE_CMD (Jetson->RT on high bus)
      - id: 0x300
        name: HOST_DRIVE_CMD
        dlc: 8
        sender: Jetson
        receivers: [RT]
        cycle_ms: 10
        comment: "Jetson Autoware.Auto drive command -> RT. High bus only."
        signals:
          - {name: HOST_DriveSpeed, byte: 0, bit_offset: 0, size: 32,
             type: signed, factor: 1, offset: 0,
             min: -500, max: 3000, unit: mm/s,
             comment: "ROS 2: linear.x * 1000"}
          - {name: HOST_YawRate, byte: 4, bit_offset: 0, size: 24,
             type: signed, factor: 1, offset: 0,
             min: -3000, max: 3000, unit: mrad/s,
             comment: "ROS 2: angular.z * 1000. i24 big-endian at bytes 4-6."}
          - {name: HOST_Gear, byte: 7, bit_offset: 0, size: 8, min: 0, max: 3, unit: enum,
             values: {0: N, 1: D, 2: S, 3: R}}

      # 0x301 — HOST_BRAKE_REQ (Jetson->RT on high bus)
      - id: 0x301
        name: HOST_BRAKE_REQ
        dlc: 4
        sender: Jetson
        receivers: [RT]
        cycle_ms: 0
        comment: "On demand. RT arbitrates: max(RT_computed, HOST_request) -> 0x205."
        signals:
          - {name: HOST_BrakePressure, byte: 0, bit_offset: 0, size: 32,
             type: signed, factor: 1, offset: 0,
             min: 0, max: 20000, unit: kPa}

      # 0x302 — HOST_LIGHT_CMD (Jetson->RT, forwarded high->low)
      - id: 0x302
        name: HOST_LIGHT_CMD
        dlc: 1
        sender: Jetson
        receivers: [RT, SYS]
        cycle_ms: 0
        comment: "Forwarded transparently high->low by RT."
        signals:
          - {name: HOST_LeftTurn,   byte: 0, bit_offset: 0, size: 1, min: 0, max: 1}
          - {name: HOST_RightTurn,  byte: 0, bit_offset: 1, size: 1, min: 0, max: 1}
          - {name: HOST_BrakeLight, byte: 0, bit_offset: 2, size: 1, min: 0, max: 1}
          - {name: HOST_Headlight,  byte: 0, bit_offset: 3, size: 1, min: 0, max: 1}

      # 0x310 — STEER_DIAG (RT->Jetson, steering telemetry @10Hz, v0.0.4)
      - id: 0x310
        name: STEER_DIAG
        dlc: 8
        sender: RT
        receivers: [Jetson]
        cycle_ms: 100
        comment: "Steering telemetry to Jetson. v0.0.4 — previously missing from DBC."
        signals:
          - {name: SteerDiag_Angle0_1deg,   byte: 0, bit_offset: 0, size: 16, type: signed,
             factor: 0.1, offset: -3000, unit: deg,
             comment: "Actual steering angle. physical_deg = raw * 0.1 - 3000. Raw 30000 -> 0deg."}
          - {name: SteerDiag_Fault,         byte: 2, bit_offset: 0, size: 8, min: 0, max: 1,
             comment: "0=OK, 1=EPS-C fault"}
          - {name: SteerDiag_MotorCurrent,  byte: 3, bit_offset: 0, size: 16,
             factor: 0.01, offset: 0, unit: A,
             comment: "EPS-C motor current, 0.01A/bit"}
          - {name: SteerDiag_ECUTemp,       byte: 5, bit_offset: 0, size: 16,
             factor: 0.1, offset: 0, unit: degC,
             comment: "EPS-C ECU temperature, 0.1degC/bit"}
          - {name: SteerDiag_Reserved,      byte: 7, bit_offset: 0, size: 8, min: 0, max: 0}

      # 0x311 — BRAKE_DIAG (RT->Jetson, brake telemetry @10Hz, v0.0.4)
      - id: 0x311
        name: BRAKE_DIAG
        dlc: 8
        sender: RT
        receivers: [Jetson]
        cycle_ms: 100
        comment: "Brake telemetry to Jetson. v0.0.4 — previously missing from DBC."
        signals:
          - {name: BrakeDiag_PressureRaw,   byte: 0, bit_offset: 0, size: 16,
             factor: 0.05, offset: 0, unit: MPa,
             comment: "SEB pressure raw, 0.05 MPa/bit"}
          - {name: BrakeDiag_Fault,         byte: 2, bit_offset: 0, size: 8, min: 0, max: 1,
             comment: "0=OK, 1=SEB fault"}
          - {name: BrakeDiag_MotorCurrent,  byte: 3, bit_offset: 0, size: 16,
             factor: 0.01, offset: 0, unit: A,
             comment: "SEB motor current, 0.01A/bit"}
          - {name: BrakeDiag_ECUTemp,       byte: 5, bit_offset: 0, size: 16,
             factor: 0.1, offset: 0, unit: degC,
             comment: "SEB ECU temperature, 0.1degC/bit"}
          - {name: BrakeDiag_Reserved,      byte: 7, bit_offset: 0, size: 8, min: 0, max: 0}

      # 0x400 — HOST_OBSTACLE_DIST (Jetson->RT on high bus)
      - id: 0x400
        name: HOST_OBSTACLE_DIST
        dlc: 4
        sender: Jetson
        receivers: [RT]
        cycle_ms: 100
        comment: "Jetson sends min obstacle distance (from LiDAR/camera perception) to RT at 10 Hz. High bus only."
        signals:
          - {name: HOST_ObstacleDistance, byte: 0, bit_offset: 0, size: 32,
             min: 0, max: 4294967295, unit: mm,
             comment: "UINT32_MAX = no reading / timeout"}

      # 0x600 — SYS_DIAG_RPT (SYS->RT, forwarded low->high)
      - id: 0x600
        name: SYS_DIAG_RPT
        dlc: 8
        sender: SYS
        receivers: [RT, Jetson]
        cycle_ms: 1000
        comment: "SYS diagnostics report. Forwarded low->high by RT."
        signals:
          - {name: SYS_DiagMode,          byte: 0, bit_offset: 0, size: 8,  min: 0, max: 2}
          - {name: SYS_DiagBrakeEngaged,  byte: 1, bit_offset: 0, size: 8,  min: 0, max: 1}
          - {name: SYS_DiagHeartbeatOk,   byte: 2, bit_offset: 0, size: 8,  min: 0, max: 1}
          - {name: SYS_DiagEstopActive,   byte: 3, bit_offset: 0, size: 8,  min: 0, max: 1}
          - {name: SYS_DiagFreeHeapKb,    byte: 4, bit_offset: 0, size: 16, min: 0, max: 65535, unit: KB}
          - {name: SYS_DiagTec,           byte: 6, bit_offset: 0, size: 8,  min: 0, max: 255}
          - {name: SYS_DiagRec,           byte: 7, bit_offset: 0, size: 8,  min: 0, max: 255}

      # 0x7FC — JETSON_HEARTBEAT (Jetson->RT, high bus only)
      - id: 0x7FC
        name: JETSON_HEARTBEAT
        dlc: 1
        sender: Jetson
        receivers: [RT]
        cycle_ms: 500
        comment: "Not bridged, high bus only. Loss triggers controlled stop, not ESTOP."
        signals:
          - {name: Jetson_AliveCtr, byte: 0, bit_offset: 0, size: 8, min: 0, max: 255,
             comment: "Timeout 1500ms -> controlled stop. Jetson is QM, not safety-critical."}

      # 0x7FD — RT_HEARTBEAT (both buses, independent counters)
      - id: 0x7FD
        name: RT_HEARTBEAT
        dlc: 1
        sender: RT
        receivers: [Jetson, SYS]
        cycle_ms: 500
        comment: "RT sends independently on both buses (per-bus, NOT bridged). Separate counters."
        signals:
          - {name: RT_AliveCtr, byte: 0, bit_offset: 0, size: 8, min: 0, max: 255,
             comment: "Low bus timeout 1000ms->SYS ESTOP; High bus 1500ms->Jetson stops /cmd_vel"}

      # 0x7FE — SYS_HEARTBEAT (SYS->RT, low bus only)
      - id: 0x7FE
        name: SYS_HEARTBEAT
        dlc: 1
        sender: SYS
        receivers: [RT]
        cycle_ms: 100
        comment: "Low bus only, never leaves low bus."
        signals:
          - {name: SYS_AliveCtr, byte: 0, bit_offset: 0, size: 8, min: 0, max: 255,
             comment: "10 Hz / 200ms timeout -> RT brake takeover + ESTOP"}

  # ── SYNTREE EPS-C (Intel/little-endian) ────────────────────────────
  syntree_eps:
    byte_order: intel
    bus: "low"
    output: rt-esp32/syntree_eps.dbc
    messages:

      # 0x169 — VCU_SES_REQ (RT -> EPS_C, 50 Hz continuous)
      - id: 0x169
        name: VCU_SES_REQ
        dlc: 8
        sender: RT
        receivers: [EPS_C]
        cycle_ms: 20
        comment: "SYNTREE EPS-C command. 50 Hz continuous. Byte 5 overlap: Speed[15:8] shares with security nibble per CSV."
        signals:
          - {name: SES_AlignEnable,    byte: 0, bit_offset: 0, size: 1,
             comment: "Angle Initial Alignment Enable. 0=disabled, 1=centering."}
          - {name: SES_CtrlEnable,     byte: 0, bit_offset: 1, size: 1,
             comment: "Direction Control Enable. 0=Disabled, 1=Enable (Angle Control)."}
          - {name: SES_TgtStrAngle,    byte: 2, bit_offset: 0, size: 16,
             type: signed, factor: 0.1, offset: -3000, min: -700, max: 700, unit: deg,
             comment: "Target Steering Angle. Negative=left. Offset=-3000 per mfr CSV."}
          - {name: SES_TgtStrAngleSpd, byte: 4, bit_offset: 0, size: 16,
             min: 125, max: 525, unit: deg/s,
             comment: "Target Angle Speed. Overlaps security signals at byte 5 per CSV. Effective 10-bit: bits 0-7 in byte 4, bits 8-9 in byte 5 bits 2-3. Bits 10-15 overlaid."}
          - {name: SES_RollCntEnable,  byte: 5, bit_offset: 0, size: 1,
             comment: "Life Signal Enable — MUST be 1. Overlaps Speed[15:8]."}
          - {name: SES_ChecksumEnable, byte: 5, bit_offset: 1, size: 1,
             comment: "Checksum Enable — MUST be 1."}
          - {name: SES_RollCnt,        byte: 5, bit_offset: 4, size: 4, min: 0, max: 15,
             comment: "Life Signal rolling counter. Increment every frame."}
          - {name: SES_VehSpd,         byte: 6, bit_offset: 0, size: 8, min: 0, max: 255, unit: km/h,
             comment: "Vehicle speed populated by RT."}
          - {name: SES_Checksum,       byte: 7, bit_offset: 0, size: 8, min: 0, max: 255,
             comment: "Checksum = XOR(bytes 0-6) ^ 0xFF."}

      # 0x201 — SES_STATUS (EPS_C -> RT, 100 Hz)
      - id: 0x201
        name: SES_STATUS
        dlc: 8
        sender: EPS_C
        receivers: [RT]
        cycle_ms: 10
        comment: "SYNTREE EPS-C status feedback. 100 Hz. Byte 5 overlap: StrAngleSpd[15:8] / Torq share byte 5 per CSV."
        signals:
          - {name: SES_AngleStatus,        byte: 0, bit_offset: 0, size: 1,
             comment: "Center Finding Status. 0=Finding, 1=Found."}
          - {name: SES_CtrlModeStatus,      byte: 0, bit_offset: 1, size: 2, min: 0, max: 3,
             comment: "Control Mode Feedback. 0=Manual, 1=Automatic."}
          - {name: SES_ErrorStatus,         byte: 0, bit_offset: 6, size: 2, min: 0, max: 3, unit: enum,
             values: {0: Normal, 1: L1_Warning, 2: L2_General, 3: L3_Severe},
             comment: "Error Status."}
          - {name: SES_StrAngle,            byte: 2, bit_offset: 0, size: 16,
             factor: 0.1, offset: -3000, min: -700, max: 700, unit: deg,
             comment: "Steering Angle. Raw 30000->0deg, 23000->-700deg, 37000->700deg."}
          - {name: SES_TgtStrAngleSpd_FB,   byte: 4, bit_offset: 0, size: 16,
             type: signed, factor: 0.5, offset: 0, min: 0, max: 1480, unit: deg/s,
             comment: "Angle Speed feedback. 16-bit signed. Overlaps Torq at byte 5."}
          - {name: SES_SteeringTorq,        byte: 5, bit_offset: 0, size: 8,
             factor: 0.1, offset: -12.1, min: -12, max: 12, unit: Nm,
             comment: "Steering Torque. Init 0x79 (121 raw = 0 Nm). Overlaps Speed[15:8]."}
          - {name: SES_RollCntEnStatus,    byte: 6, bit_offset: 0, size: 1,
             comment: "Life Signal Enable Feedback."}
          - {name: SES_ChecksumEnStatus,   byte: 6, bit_offset: 1, size: 1,
             comment: "Checksum Enable Feedback."}
          - {name: SES_RollCntStatus,      byte: 6, bit_offset: 4, size: 4, min: 0, max: 15,
             comment: "Life Signal Feedback — echoes rolling counter."}
          - {name: SES_ChecksumStatus,     byte: 7, bit_offset: 0, size: 8, min: 0, max: 255,
             comment: "Checksum Feedback = XOR(bytes 0-6) ^ 0xFF."}

      # 0x202 — SES_ErrInfo (EPS_C -> RT, 10 Hz)
      - id: 0x202
        name: SES_ErrInfo
        dlc: 8
        sender: EPS_C
        receivers: [RT]
        cycle_ms: 100
        comment: "SYNTREE EPS-C detailed fault flags. 8 L3 faults (redundant sensor loss) -> RT must escalate to ESTOP."
        signals:
          - {name: SES_ECUUnderVolt,  byte: 0, bit_offset: 0, size: 1, comment: "Controller Under Voltage [L2]"}
          - {name: SES_ECUOverVolt,   byte: 0, bit_offset: 1, size: 1, comment: "Controller Over Voltage [L2]"}
          - {name: SES_CanComErr,     byte: 0, bit_offset: 2, size: 1, comment: "CAN Communication Fault [L1]"}
          - {name: SES_ECUTempErr,    byte: 0, bit_offset: 3, size: 1, comment: "Controller Temp Fault [L1]"}
          - {name: SES_DomainSC,      byte: 0, bit_offset: 4, size: 1, comment: "Domain Drive Short Circuit [L2]"}
          - {name: SES_DomainV,       byte: 0, bit_offset: 5, size: 1, comment: "Domain Drive Voltage Fault [L2]"}
          - {name: SES_DomainT,       byte: 0, bit_offset: 6, size: 1, comment: "Domain Drive Temperature Fault [L2]"}
          - {name: SES_TempSensor,    byte: 0, bit_offset: 7, size: 1, comment: "Temperature Sensor Fault"}
          - {name: SES_AngleP_OC,     byte: 1, bit_offset: 0, size: 1, comment: "Angle Sensor Pri. Open Circuit [L3]"}
          - {name: SES_AngleP_AF,     byte: 1, bit_offset: 1, size: 1, comment: "Angle Sensor Pri. Out of Range [L3]"}
          - {name: SES_AngleS_OC,     byte: 1, bit_offset: 2, size: 1, comment: "Angle Sensor Sec. Open Circuit [L3]"}
          - {name: SES_AngleS_AF,     byte: 1, bit_offset: 3, size: 1, comment: "Angle Sensor Sec. Out of Range [L3]"}
          - {name: SES_SensorPow,     byte: 1, bit_offset: 4, size: 1, comment: "Sensor Power Fault [L2]"}
          - {name: SES_Alignment,     byte: 1, bit_offset: 5, size: 1, comment: "Centering Fault [L1]"}
          - {name: SES_OverAngle,     byte: 1, bit_offset: 6, size: 1, comment: "Over Angle Fault [L2]"}
          - {name: SES_StrMtrStall,   byte: 1, bit_offset: 7, size: 1, comment: "Motor Stall Fault [L1]"}
          - {name: SES_MtrCurtFault,  byte: 2, bit_offset: 0, size: 1, comment: "Motor Current Fault [L2]"}
          - {name: SES_SensorCL,      byte: 2, bit_offset: 1, size: 1, comment: "Sensor 5V Power Fault [L2]"}
          - {name: SES_TorqT1_OC,     byte: 2, bit_offset: 2, size: 1, comment: "Torque Sensor T1 Open Circuit [L3]"}
          - {name: SES_TorqT1_AF,     byte: 2, bit_offset: 3, size: 1, comment: "Torque Sensor T1 Out of Range [L3]"}
          - {name: SES_TorqT2_OC,     byte: 2, bit_offset: 4, size: 1, comment: "Torque Sensor T2 Open Circuit [L3]"}
          - {name: SES_TorqT2_AF,     byte: 2, bit_offset: 5, size: 1, comment: "Torque Sensor T2 Out of Range [L3]"}
          - {name: SES_SentAngle,     byte: 2, bit_offset: 6, size: 1, comment: "Angle Error [L1]"}
          - {name: SES_StrMtrIdling,  byte: 2, bit_offset: 7, size: 1, comment: "Motor Idling Fault [L2]"}
          - {name: SES_EPROM,         byte: 3, bit_offset: 0, size: 1, comment: "EEPROM Fault [L2]"}
          - {name: SES_VehSpdSnapshot, byte: 7, bit_offset: 0, size: 8, min: 0, max: 255, unit: km/h,
             comment: "Vehicle speed at fault snapshot."}

      # 0x203 — SES_Version (EPS_C -> RT, 1 Hz)
      - id: 0x203
        name: SES_Version
        dlc: 8
        sender: EPS_C
        receivers: [RT]
        cycle_ms: 1000
        comment: "SYNTREE EPS-C firmware version. Log on boot for compatibility check."
        signals:
          - {name: SES_SW_Version, byte: 0, bit_offset: 0, size: 8,
             factor: 0.01, offset: 0, min: 0, max: 2.55,
             comment: "Software version (e.g. 0x64 = 1.00)"}
          - {name: SES_HW_Version, byte: 1, bit_offset: 0, size: 8,
             factor: 0.1, offset: 0, min: 0, max: 25.5,
             comment: "Hardware version (e.g. 0x0D = 1.3)"}

      # 0x6FA — SES_Test (EPS_C -> RT, 100 Hz telemetry)
      - id: 0x6FA
        name: SES_Test
        dlc: 8
        sender: EPS_C
        receivers: [RT]
        cycle_ms: 10
        comment: "SYNTREE EPS-C telemetry. 100 Hz. Bytes 0,7 reserved. Narrower ranges than brake SEB_Test."
        signals:
          - {name: SES_MtrCurt,  byte: 1, bit_offset: 0, size: 16, type: signed,
             factor: 0.0078125, offset: 0, min: 0, max: 60, unit: A,
             comment: "Motor current. Monitor for mechanical binding / rack damage."}
          - {name: SES_ECUTemp,  byte: 3, bit_offset: 0, size: 16,
             factor: 0.5, offset: 0, min: 0, max: 255, unit: degC,
             comment: "ECU temperature. For thermal throttling."}
          - {name: SES_PowVolt,  byte: 5, bit_offset: 0, size: 16,
             factor: 0.00390625, offset: 0, min: 0, max: 18, unit: V,
             comment: "Supply voltage. 0-18V range."}

  # ── SYNTREE SEB (Intel/little-endian) ──────────────────────────────
  syntree_seb:
    byte_order: intel
    bus: "low"
    output: sys-esp32/syntree_seb.dbc
    messages:

      # 0x7B9 — VCU_SEB_REQ (SYS -> SEB, 50 Hz continuous)
      - id: 0x7B9
        name: VCU_SEB_REQ
        dlc: 8
        sender: SYS
        receivers: [SEB]
        cycle_ms: 20
        comment: "SYNTREE SEB brake command. 50 Hz continuous. Byte 3 mode-mux: Stroke[15:8] in Mode 0, Pressure in Mode 1."
        signals:
          - {name: SEB_AlignEnable,    byte: 0, bit_offset: 0, size: 1, comment: "Calibration enable."}
          - {name: SEB_CtrlEnable,     byte: 0, bit_offset: 1, size: 1, comment: "Active control enable."}
          - {name: SEB_CtrlMode,       byte: 0, bit_offset: 2, size: 1, unit: enum,
             values: {0: Stroke, 1: Pressure},
             comment: "0=Stroke (position), 1=Pressure (hydraulic)."}
          - {name: SEB_AutoBrake,      byte: 0, bit_offset: 3, size: 1, comment: "Auto-brake / emergency trigger."}
          - {name: SEB_StrokeReq,      byte: 2, bit_offset: 0, size: 16,
             factor: 0.05, offset: -30, min: -5, max: 27, unit: mm,
             comment: "Stroke position. Full 16-bit in Stroke mode. Overlaps with PressureReq at byte 3."}
          - {name: SEB_PressureReq,    byte: 3, bit_offset: 0, size: 8,
             factor: 0.05, offset: 0, min: 0, max: 5, unit: MPa,
             comment: "Pressure in Mode 1. Overlaps Stroke[15:8] — mode-dependent."}
          - {name: SEB_RollCntEnable,  byte: 6, bit_offset: 0, size: 1, comment: "Life Signal Validity — MUST be 1."}
          - {name: SEB_ChecksumEnable, byte: 6, bit_offset: 1, size: 1, comment: "Checksum Validity — MUST be 1."}
          - {name: SEB_RollCnt,        byte: 6, bit_offset: 4, size: 4, min: 0, max: 15,
             comment: "Life Signal rolling counter. Increment every frame."}
          - {name: SEB_Checksum,       byte: 7, bit_offset: 0, size: 8, min: 0, max: 255,
             comment: "Checksum = XOR(bytes 0-6) ^ 0xFF."}

      # 0x721 — SEB_STATUS (SEB -> SYS, 100 Hz)
      - id: 0x721
        name: SEB_STATUS
        dlc: 8
        sender: SEB
        receivers: [SYS]
        cycle_ms: 10
        comment: "SYNTREE SEB status feedback. 100 Hz. SYS usage: boot sync -> read StrokeValue; active -> confirm AlignStatus==1."
        signals:
          - {name: SEB_AlignStatus,        byte: 0, bit_offset: 0, size: 1, comment: "Alignment Info Feedback. 1=aligned."}
          - {name: SEB_CtrlEnStatus,       byte: 0, bit_offset: 1, size: 1, comment: "Control Enable Feedback."}
          - {name: SEB_CtrlModeStatus,     byte: 0, bit_offset: 2, size: 2, min: 0, max: 3,
             values: {0: None, 1: Stroke, 2: Pressure}, comment: "Control Mode Feedback."}
          - {name: SEB_AutoBrakeStatus,    byte: 0, bit_offset: 4, size: 1, comment: "Auto Brake Status Feedback."}
          - {name: SEB_ErrorStatus,        byte: 0, bit_offset: 6, size: 2, min: 0, max: 3, unit: enum,
             values: {0: Normal, 1: L1_Warning, 2: L2_General, 3: L3_Severe}, comment: "Error Status."}
          - {name: SEB_StrokeValue,        byte: 2, bit_offset: 0, size: 16,
             factor: 0.05, offset: -30, min: -5, max: 27, unit: mm, comment: "Stroke Value Feedback."}
          - {name: SEB_PressureValue,      byte: 3, bit_offset: 0, size: 8,
             factor: 0.05, offset: 0, min: 0, max: 5, unit: MPa,
             comment: "Pressure Feedback. Overlaps Stroke[15:8] — mode-dependent."}
          - {name: SEB_AngleValue,         byte: 5, bit_offset: 0, size: 16, type: signed,
             factor: 0.5, offset: 0, min: -150, max: 840,
             comment: "Angle Feedback. Overlaps security echo at byte 6."}
          - {name: SEB_RollCntEnStatus,   byte: 6, bit_offset: 0, size: 1, comment: "Life Signal Status Feedback."}
          - {name: SEB_ChecksumEnStatus,  byte: 6, bit_offset: 1, size: 1, comment: "Checksum Status Feedback."}
          - {name: SEB_RollCntStatus,     byte: 6, bit_offset: 4, size: 4, min: 0, max: 15,
             comment: "Life Signal Feedback — echoes rolling counter."}
          - {name: SEB_ChecksumStatus,    byte: 7, bit_offset: 0, size: 8, min: 0, max: 255,
             comment: "Checksum Feedback."}

      # 0x731 — SEB_ErrInfo (SEB -> SYS, 10 Hz)
      - id: 0x731
        name: SEB_ErrInfo
        dlc: 8
        sender: SEB
        receivers: [SYS]
        cycle_ms: 100
        comment: "SYNTREE SEB detailed fault flags. 14 of 23 faults are L3 -> SYS must escalate to ESTOP."
        signals:
          - {name: SEB_ECUUnderVolt,     byte: 0, bit_offset: 0, size: 1, comment: "Controller Undervoltage [L2]"}
          - {name: SEB_ECUOverVolt,      byte: 0, bit_offset: 1, size: 1, comment: "Controller Overvoltage [L2]"}
          - {name: SEB_CanComErr,        byte: 0, bit_offset: 2, size: 1, comment: "CAN Communication Fault [L3]"}
          - {name: SEB_ECUTempErr,       byte: 0, bit_offset: 3, size: 1, comment: "Controller Temperature Fault [L3]"}
          - {name: SEB_DomainSC,         byte: 0, bit_offset: 4, size: 1, comment: "Domain Drive Short Circuit [L3]"}
          - {name: SEB_DomainV,          byte: 0, bit_offset: 5, size: 1, comment: "Domain Drive Voltage Fault [L3]"}
          - {name: SEB_DomainT,          byte: 0, bit_offset: 6, size: 1, comment: "Domain Drive Temperature Fault [L3]"}
          - {name: SEB_AngleP_OC,        byte: 0, bit_offset: 7, size: 1, comment: "Angle Sensor P Open Circuit [L3]"}
          - {name: SEB_AngleP_AF,        byte: 1, bit_offset: 0, size: 1, comment: "Angle Sensor P Mainboard Abnormal [L3]"}
          - {name: SEB_AngleS_OC,        byte: 1, bit_offset: 1, size: 1, comment: "Angle Sensor S Open Circuit [L3]"}
          - {name: SEB_AngleS_AF,        byte: 1, bit_offset: 2, size: 1, comment: "Angle Sensor S Sub-board Abnormal [L3]"}
          - {name: SEB_NoPreSensor,      byte: 1, bit_offset: 3, size: 1, comment: "Unconnected Oil Pressure Sensor [L3]"}
          # Byte 1 bit 4: reserved (unused per SYNTREE CSV)
          - {name: SEB_SensorUCL,        byte: 1, bit_offset: 5, size: 1, comment: "Sensor Plausibility Fault [L3]"}
          - {name: SEB_AlignmentErr,     byte: 1, bit_offset: 6, size: 1, comment: "Alignment Fault [L2]"}
          - {name: SEB_AngleOver,        byte: 1, bit_offset: 7, size: 1, comment: "Angle Out of Bounds [L2]"}
          - {name: SEB_MtrStall,         byte: 2, bit_offset: 1, size: 1, comment: "Motor Stall Fault [L3]"}
          - {name: SEB_MtrDC,            byte: 2, bit_offset: 2, size: 1, comment: "Motor Disconnect Fault [L3]"}
          - {name: SEB_OilErr,           byte: 2, bit_offset: 3, size: 1, comment: "Oil Pressure Error [L2]"}
          - {name: SEB_InitOil,          byte: 2, bit_offset: 4, size: 1, comment: "Initial Oil Pressure Fault [L3]"}
          - {name: SEB_SentValue,        byte: 2, bit_offset: 5, size: 1, comment: "Send Value Error [L3]"}
          - {name: SEB_MtrNoLoad,        byte: 2, bit_offset: 6, size: 1, comment: "Motor No-load Fault [L3]"}
          - {name: SEB_PreSensorOver,    byte: 3, bit_offset: 0, size: 1, comment: "Oil Pressure Sensor Overvoltage [L2]"}
          - {name: SEB_LowVoltCharging,  byte: 3, bit_offset: 1, size: 1, comment: "Low Voltage Charging Failure [L2]"}

      # 0x741 — SEB_Version (SEB -> SYS, 1 Hz)
      - id: 0x741
        name: SEB_Version
        dlc: 8
        sender: SEB
        receivers: [SYS]
        cycle_ms: 1000
        comment: "SYNTREE SEB firmware version. Log on boot for compatibility check."
        signals:
          - {name: SEB_SW_Version, byte: 0, bit_offset: 0, size: 8,
             factor: 0.01, offset: 0, min: 0, max: 2.55,
             comment: "Software version (e.g. 0xC8 = 2.00)"}
          - {name: SEB_HW_Version, byte: 1, bit_offset: 0, size: 8,
             factor: 0.1, offset: 0, min: 0, max: 25.5,
             comment: "Hardware version (e.g. 0x0D = 1.3)"}

      # 0x6FB — SEB_Test (SEB -> SYS, 100 Hz telemetry)
      - id: 0x6FB
        name: SEB_Test
        dlc: 8
        sender: SEB
        receivers: [SYS]
        cycle_ms: 10
        comment: "SYNTREE SEB telemetry. 100 Hz. Bytes 0,7 reserved. Wider ranges than steering SES_Test."
        signals:
          - {name: SEB_MtrCurr,  byte: 1, bit_offset: 0, size: 16, type: signed,
             factor: 0.0078125, offset: 0, min: -255, max: 255, unit: A,
             comment: "Motor current. Monitor for mechanical binding."}
          - {name: SEB_ECUTemp,  byte: 3, bit_offset: 0, size: 16,
             factor: 0.5, offset: 0, min: -40, max: 215, unit: degC,
             comment: "ECU temperature. For over-temperature early warning."}
          - {name: SEB_PowVolt,  byte: 5, bit_offset: 0, size: 16,
             factor: 0.00390625, offset: 0, min: 0, max: 32, unit: V,
             comment: "Supply voltage. 0-32V range."}
