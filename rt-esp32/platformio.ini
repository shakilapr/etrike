[platformio]
default_envs = vehicle
test_dir = test
; ── Optional: active PID speed control ───────────────────────────────
; CONFIG_ENABLE_ACTIVE_PID — injects PID correction into 0x204 motor
;   setpoint using rear motor encoder feedback (0x220 telemetry).
;   PREREQUISITES (all 6 must be true before enabling — see main.cpp:283):
;     1. Rear motor encoder installed on GPIO 1/2
;     2. Quadrature phasing verified
;     3. CONFIG_ENABLE_ENCODERS defined (enables PCNT hardware)
;     4. Speed reading validated on 0x220 RT_PID_RPT telemetry
;     5. No-load bench test: PID tracks setpoint without oscillation
;     6. THEN add -D CONFIG_ENABLE_ACTIVE_PID to build_flags
;   Add to build_flags:  -D CONFIG_ENABLE_ACTIVE_PID  -D CONFIG_ENABLE_ENCODERS

[env:vehicle]
extra_scripts = pre:../shared/can/pio_prebuild.py
    pre:../shared/can/patch_sdkconfig.py
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.esp_idf.sdkconfig_append = sdkconfig.defaults
build_src_filter = +<main.cpp> +<freertos_hooks.cpp> +<physics_model.cpp> +<can_driver_mcp2515.cpp> +<can_driver_twai.cpp> +<encoder_pcnt.cpp> -<native_entry.cpp>
test_framework = unity

build_flags =
    -std=gnu++17
    -Wno-error
    -D CONFIG_FREERTOS_HZ=1000
    -D CONFIG_TWAI_ISR_IN_IRAM=1
    -D FW_VERSION="v0.3.0-alpha-vehicle"
    -I ../shared
build_unflags = -Werror

[env:bench]
extra_scripts = pre:../shared/can/pio_prebuild.py
    pre:../shared/can/patch_sdkconfig.py
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.esp_idf.sdkconfig_append = sdkconfig.defaults
build_src_filter = +<main.cpp> +<freertos_hooks.cpp> +<physics_model.cpp> +<can_driver_mcp2515.cpp> +<can_driver_twai.cpp> +<encoder_pcnt.cpp> -<native_entry.cpp>
test_framework = unity

build_flags =
    -std=gnu++17
    -Wno-error
    -D CONFIG_FREERTOS_HZ=1000
    -D CONFIG_TWAI_ISR_IN_IRAM=1
    -D FW_VERSION="v0.3.0-alpha-bench"
    -D ETRIKE_SYSTEM_RUN_MODE=2
    -I ../shared
build_unflags = -Werror

[env:hardware_bench]
extends = env:vehicle
build_flags =
    ${env:vehicle.build_flags}
    -D ETRIKE_SYSTEM_RUN_MODE=1

[env:native]
platform = native
build_src_filter = +<*.cpp> -<main.cpp> -<freertos_hooks.cpp> -<can_driver_mcp2515.cpp> -<can_driver_twai.cpp> -<encoder_pcnt.cpp>
test_framework = unity
test_build_src = true
build_flags =
    -std=gnu++17
    -Wno-error
    -mconsole
    -I ../shared
    -I ../native-test/hal/shadow
    -D HOST_BUILD
    -D ETRIKE_SYSTEM_RUN_MODE=2
