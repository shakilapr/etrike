[platformio]
default_envs = vehicle

[env:vehicle]
extra_scripts = pre:../shared/can/pio_prebuild.py
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
board_build.f_cpu = 240000000L

build_flags =
    -std=gnu++17
    -Wno-error
    -D CONFIG_FREERTOS_HZ=1000
    -D CONFIG_TWAI_ISR_IN_IRAM=1
    -D FW_VERSION="v1.0.0-vehicle"
    -I ../shared
build_unflags = -Werror

[env:bench]
extra_scripts = pre:../shared/can/pio_prebuild.py
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
board_build.f_cpu = 240000000L

build_flags =
    -std=gnu++17
    -Wno-error
    -D CONFIG_FREERTOS_HZ=1000
    -D CONFIG_TWAI_ISR_IN_IRAM=1
    -D BENCH_BUILD_ACKNOWLEDGED
    -D CONFIG_BENCH_SOLO
    -D CONFIG_BYPASS_EPS_C_SYNC
    -D CONFIG_BYPASS_SEB_SYNC
    -D CONFIG_BYPASS_MTR_ABSENT
    -D FW_VERSION="v1.0.0-bench"
    -I ../shared
build_unflags = -Werror

[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wno-error
    -I ../shared
    -I ../native-test/hal/shadow
    -D HOST_BUILD
