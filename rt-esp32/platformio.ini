[platformio]
default_envs = vehicle
test_dir = test
; ── Feature flags (set per environment below) ────────────────────────
; All RT features are controlled via ETRIKE_RT_ macros in build_flags.
; Validation and typed constants are in src/build_config.h.
; See docs/rt-sys-feature-configuration-and-test-plan.md for full reference.
;   ETRIKE_RT_KINEMATICS_RESOLVER: 0=bicycle, 1=direct-passthrough
;   ETRIKE_RT_SPEED_FEEDBACK_SOURCE: 0=none, 1=MTR, 2=RT-encoder, 3=calculated
;   ETRIKE_RT_PID_MODE: 0=disabled, 1=shadow, 2=active
;   ETRIKE_RT_ENCODERS: 0=disabled, 1=enabled

[env:vehicle]
extra_scripts = pre:../protocol/tools/pio_prebuild_canonical.py
    pre:pio_patch_sdkconfig.py
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.esp_idf.sdkconfig_append = sdkconfig.defaults
build_src_filter = +<main.cpp> +<freertos_hooks.cpp> +<physics_model.cpp> +<direct_resolver.cpp> +<can_driver_mcp2515.cpp> +<can_driver_twai.cpp> +<encoder_pcnt.cpp> -<native_entry.cpp>
test_framework = unity

build_flags =
    -std=gnu++17
    -Wno-error
    -D CONFIG_FREERTOS_HZ=1000
    -D CONFIG_TWAI_ISR_IN_IRAM=1
    -D FW_VERSION="v0.3.0-alpha-vehicle"
    ; ── Kinematics resolver ────────────────────────────────────────────
    ; 0 = Bicycle physics (physics_model.cpp), 1 = Direct passthrough (direct_resolver.cpp)
    -D ETRIKE_RT_KINEMATICS_RESOLVER=0
    ; ── Speed feedback source ──────────────────────────────────────────
    ; 0 = None (open-loop), 1 = MTR report, 2 = RT rear encoder, 3 = Calculated
    -D ETRIKE_RT_SPEED_FEEDBACK_SOURCE=0
    ; ── PID mode ───────────────────────────────────────────────────────
    ; 0 = Disabled, 1 = Shadow (telemetry only), 2 = Active
    -D ETRIKE_RT_PID_MODE=0
    ; ── Encoder subsystem ──────────────────────────────────────────────
    ; 0 = Disabled, 1 = Enabled
    -D ETRIKE_RT_ENCODERS=0
    -I ..
    -I ../shared
build_unflags = -Werror

[env:bench]
extra_scripts = pre:../protocol/tools/pio_prebuild_canonical.py
    pre:pio_patch_sdkconfig.py
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.esp_idf.sdkconfig_append = sdkconfig.defaults
build_src_filter = +<main.cpp> +<freertos_hooks.cpp> +<physics_model.cpp> +<direct_resolver.cpp> +<can_driver_mcp2515.cpp> +<can_driver_twai.cpp> +<encoder_pcnt.cpp> -<native_entry.cpp>
test_framework = unity

build_flags =
    -std=gnu++17
    -Wno-error
    -D CONFIG_FREERTOS_HZ=1000
    -D CONFIG_TWAI_ISR_IN_IRAM=1
    -D FW_VERSION="v0.3.0-alpha-bench"
    -D ETRIKE_SYSTEM_RUN_MODE=2
    ; ── Kinematics resolver ────────────────────────────────────────────
    -D ETRIKE_RT_KINEMATICS_RESOLVER=0
    ; ── Speed feedback source: Calculated for bench SIL testing ────────
    -D ETRIKE_RT_SPEED_FEEDBACK_SOURCE=3
    ; ── PID mode: Shadow for bench observation ─────────────────────────
    -D ETRIKE_RT_PID_MODE=1
    ; ── Encoder subsystem: disabled on bench ────────────────────────────
    -D ETRIKE_RT_ENCODERS=0
    -I ..
    -I ../shared
build_unflags = -Werror

[env:hardware_bench]
extends = env:vehicle
build_flags =
    ${env:vehicle.build_flags}
    -D ETRIKE_SYSTEM_RUN_MODE=1

[env:native]
platform = native
build_src_filter = +<*.cpp> -<main.cpp> -<freertos_hooks.cpp> -<can_driver_mcp2515.cpp> -<can_driver_twai.cpp> -<encoder_pcnt.cpp>
test_framework = unity
test_build_src = true
build_flags =
    -std=gnu++17
    -Wno-error
    -mconsole
    -I ..
    -I ../shared
    -I ../native-test/hal/shadow
    -D HOST_BUILD
    -D ETRIKE_SYSTEM_RUN_MODE=2
