[pytest]
markers =
    hardware: tests that require physical hardware
    unit: unit tests
    integration: integration tests
    scenario: scenario tests
    soak: soak tests
testpaths =
    tests
addopts = 
    --cov=.
    --cov-report=term-missing
    --cov-fail-under=90
    --cov-branch
asyncio_mode = auto
