[platformio]
default_envs = pwr_tx_rx_500k

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = espidf
monitor_speed = 115200
board_build.esp_idf.sdkconfig_append = sdkconfig.defaults
build_flags =
    -std=gnu++17
    -Wno-error
    -D CONFIG_FREERTOS_HZ=1000
    -D CONFIG_TWAI_ISR_IN_IRAM=1
    -I ..
    -I ../shared
build_unflags = -Werror

; Default: Classic ESP32-WROOM-32UE using printed TX (GPIO 1) and RX (GPIO 3) @ 250 kbps
[env:pwr_tx_rx_250k]
build_flags =
    ${env.build_flags}
    -D CONFIG_CAN_TX_PIN=1
    -D CONFIG_CAN_RX_PIN=3
    -D CONFIG_CAN_BITRATE_HZ=250000

; Same printed TX/RX pins @ 500 kbps
[env:pwr_tx_rx_500k]
build_flags =
    ${env.build_flags}
    -D CONFIG_CAN_TX_PIN=1
    -D CONFIG_CAN_RX_PIN=3
    -D CONFIG_CAN_BITRATE_HZ=500000

; In case header silkscreen TX2 / RX2 (GPIO 17 / 16) is used
[env:pwr_tx2_rx2_250k]
build_flags =
    ${env.build_flags}
    -D CONFIG_CAN_TX_PIN=17
    -D CONFIG_CAN_RX_PIN=16
    -D CONFIG_CAN_BITRATE_HZ=250000

; Bench self-test mode: transmits frames without requiring peer ACK on the bus
[env:pwr_bench_self_test]
build_flags =
    ${env.build_flags}
    -D CONFIG_CAN_TX_PIN=1
    -D CONFIG_CAN_RX_PIN=3
    -D CONFIG_CAN_BITRATE_HZ=250000
    -D CONFIG_CAN_SELF_TEST=1
